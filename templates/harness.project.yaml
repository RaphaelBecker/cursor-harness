# Copy this file to the consumer project root as `harness.project.yaml`.
# This is the only required project interface. Install fails closed without it.
#
#   cp vendor/cursor-harness/templates/harness.project.yaml harness.project.yaml
#   ./vendor/cursor-harness/install.sh --target . --check
#
# Do not put product secrets here. Add `.cursor/night-shift/*.pid`,
# `.cursor/night-shift/*.log`, `.cursor/night-shift/slots/`, and
# `.cursor/night-shift/decisions.tsv` to gitignore.

# files | none
issue_source: none

# files:
#   path: issues/

test:
  discover: true
  # worktree: npm run test:affected --   # optional dispatcher; types + contract list
  # targeted: npm test --                # implement RED/GREEN
  # fast: npm run test:fast              # FULL coverage/lint/types slice — not worktree proof
  # full: npm run test:complete          # idle-main complete only

# Scarce test resource (golden DB pool, device farm). Custom lease is acquired
# at worktree proof only when a listed suite needs the pool — not at fire.
# Built-in count (no lease script) is an optional host throttle at fire, not a DB.
# Omit slots to fire every prepared worktree. About 3 parallel agents has been
# comfortable on a laptop; that is experience, not a harness cap.
# slots:
#   count: 3
#   lease: ./scripts/lease-test-slot.sh  # acquire only when a listed suite needs the pool
#   status: ./scripts/lease-test-slot.sh # live-lease check: `<script> has-live-leases`

docs:
  routing: .cursor/rules/doc-routing.local.mdc
memory: project_memory.md

# Optional exclusive lock for /ship-local (one land at a time). The command
# must accept acquire / release. If omitted, ship-local uses `.cursor/ship-local.lock`.
# leftovers: classify dirty paths; `--apply` (or `-- --apply` for npm) absorbs
# reset-class only and must not commit.
# ship:
#   lock: ./scripts/ship-local-lock.sh
#   leftovers: ./scripts/leftovers-classify.sh

# Optional afterFileEdit autofix — copy templates/hooks/autofix.example.sh to
# `.cursor/hooks/autofix.sh` (consumer-owned; install preserves project hooks).
# autofix:
#   js: npx eslint --fix
#   py: ruff format

# core is always installed. Optional: bdd, vitest,
# playwright, supabase, nextjs, github-actions, quality-audit.
packs:
  - core

# Night executor (local Cursor CLI). Do not prepend & (cloud handoff).
executor:
  command: agent
  prompt: "@execute-approved-plan"
  model: composer-2.5
