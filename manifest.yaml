# cursor-harness pack registry — install.sh reads this file
version: 1
defaults:
  mode: symlink
  pack_set: core
pack_sets:
  core:
    rules:
      - core-principles.mdc
      - deep-modules-clean-architecture.mdc
      - doc-routing.mdc
      - developer-communication.mdc
      - code-quality.mdc
      - testing.mdc
      - security-basics.mdc
    skills:
      - implementation-plan-review
      - grill-me
      - execute-approved-plan
      - project-memory
      - ship-local
      - review-code
      - sync-spec-docs
      - help
      - glossary
      - create-workflow
      - sync
      - review-docs
      - test-harness-optimize
      - blast-radius
      - diagnose-bug
      - bugticket-from-screenshots
      - wait-what
      - summarize-plan
      - architecture-audit
      - extract-deep-module
      - dependency-direction-fix
      - workflows/ship-prod
      - workflows/prep
      - workflows/night-shift
    agents:
      - verifier.md
    automations: true
    hooks:
      enabled: true
  bdd:
    skills:
      - generate-bdd-test-spec
  vitest:
    skills:
      - generate-vitest-test
      - implement-unit-tests
  playwright:
    skills:
      - implement-e2e-tests
      - e2e-single-test-triage
      - fix-flaky-test
  supabase:
    rules:
      - database-sql.mdc
    skills:
      - add-supabase-migration
      - regen-db-types
      - verify-rls-policies
      - inspect-db-schema
      - review-database
      - review-sql-performance
    agents:
      - supabase-architect.md
      - db-schema-auditor.md
  nextjs:
    rules:
      - typescript-react.mdc
      - nextjs-api-routes.mdc
    skills:
      - review-performance
  github-actions:
    rules:
      - github-actions.mdc
    skills:
      - review-github-actions
  quality-audit:
    skills:
      - audit-hotspots
      - audit-module-boundaries
      - workflows/codebase-health-audit
    agents:
      - architecture-health-auditor.md
